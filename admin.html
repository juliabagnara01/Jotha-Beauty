    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header>
        <div class="logo">
            <img src="img/logo.png" alt="Logo da Jotha Beauty" class="simbolo-logo">
            <h1>Jotha Beauty</h1>
        </div>

        <p>Sua beleza, nosso toque especial</p>

        <nav>
            <a href="index.html">Início</a>
            <a href="index.html#sobre">Sobre</a>
            <a href="index.html#servicos">Serviços</a>
            <a href="pacotes.html">Pacotes</a>
            <a href="cadastro.html">Cadastro</a>
            <a href="login.html">Login</a>
            <a href="admin.html">Admin</a>
        </nav>

        <div class="acessibilidade">
            <button type="button" id="btn-tema">
                Modo escuro
            </button>

            <button type="button" id="btn-fonte">
               Aumentar fonte
            </button>
        </div>
    </header>

    <main>
        <section class="secao-admin">
            <h2>Administração de Usuários</h2>

            <p>
                Cadastre e gerencie os usuários da Jotha Beauty.
            </p>

            <form id="form-admin">
                <label for="nome-admin">Nome:</label>
                <input type="text" id="nome-admin" name="nome" placeholder="Digite o nome" required>

                <label for="email-admin">E-mail:</label>
                <input type="email" id="email-admin" name="email" placeholder="Digite o e-mail" required>

                <div class="botoes-admin">
                    <button type="submit" id="btn-cadastrar">
                        Cadastrar
                    </button>

                    <button type="reset" id="btn-limpar">
                        Limpar campos
                    </button>
                </div>
            </form>

            <ul id="lista-usuarios">
            </ul>

            <label for="pesquisa-admin">
                Pesquisar usuário:
            </label>

            <input type="search" id="pesquisa-admin" placeholder="Pesquisar por nome ou e-mail">

            <button type="button" id="btn-excluir-todos">
                Excluir todos
            </button>
        </section>
    </main>

    <footer>

            </a>

            <a href="https://www.linkedin.com/in/thaina-tamiris-souza-dionisio-3291593a8/" target="_blank" rel="noopener noreferrer">

                LinkedIn da Thaina

        </div>
